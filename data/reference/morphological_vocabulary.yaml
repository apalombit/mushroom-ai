# =============================================================================
#  STEM INTERIOR
# =============================================================================
stem_interior:
  description: >
    Whether the stem is hollow, solid, or intermediate. Checked by cutting
    the stem lengthwise. Diagnostic for many genera.
    Source: Senthilarasu & Kumaresan 2018 (CREAM), MushroomExpert.com.
  canonical_values:
    hollow: "Completely empty inside with no flesh in the central canal"
    solid: "Firm flesh throughout, no cavity"
    stuffed: "Filled with soft pithy or cottony tissue that may become hollow with age"
  aliases:
