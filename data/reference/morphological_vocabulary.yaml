    friable: "Universal veil remnants crumbling into powdery concentric rings or patches around the bulb base (informal; some Amanita)"
    napiform: "Bulb and adhering veil remnants forming a turnip-shaped swelling; no distinct free cup formed"
    absent: "No volva present"
