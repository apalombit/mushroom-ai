# =============================================================================
#  GILL ATTACHMENT
# =============================================================================
gill_attachment:
  description: >
    How the gills connect to the stem. A primary diagnostic feature for gilled
    mushrooms, often the first character checked after confirming gills are present.
    Source: Senthilarasu & Kumaresan 2018 (CREAM), Largent & Stuntz 1977.
  canonical_values:
    remote: "Gills conspicuously separated from the stem with a wide gap, not touching at all (broader separation than free; Amanita, Volvariella)"
    free: "Gills do not reach or touch the stem; narrow clear gap"
    adnexed: "Gills narrowly attached, curving up slightly before meeting stem"
    adnate: "Gills broadly attached to the stem at full gill width"
    sinuate: "Gills notched or scooped out just before attaching to stem (also: emarginate)"
    subdecurrent: "Gills running slightly down the stem below the cap-stem junction; less than fully decurrent"
    decurrent: "Gills running conspicuously down the stem below the cap-stem junction"
    seceding: "Initially attached but breaking away from stem with age"
  aliases:
    "attached": "adnate"
    "attached to the stem": "adnate"
    "free from the stem or slightly attached to it": "free"
    "adnate to adnexed": "adnexed"
    "adnate to adnexed or seceding to free": "seceding"
    "adnate to decurrent": "decurrent"
    "emarginate": "sinuate"
    "notched": "sinuate"
  similarity_matrix:
    "remote-free": 0.6
    "free-adnexed": 0.4
    "adnate-adnexed": 0.8
    "adnate-sinuate": 0.6
    "adnexed-sinuate": 0.5
    "adnate-subdecurrent": 0.6
    "subdecurrent-decurrent": 0.7
    "free-sinuate": 0.3
    "remote-adnexed": 0.2

# =============================================================================
#  GILL SPACING
# =============================================================================
gill_spacing:
  description: >
    The density of gills around the cap margin. Assessed by counting gills
    per centimeter at the cap margin or by visual impression.
    Source: Senthilarasu & Kumaresan 2018 (CREAM), Largent & Stuntz 1977.
  canonical_values:
    crowded: "Gills very close together, many per cm"
    close: "Gills moderately spaced, typical density"
    subdistant: "Gills somewhat spaced apart"
    distant: "Gills widely spaced, few per cm"
  aliases:
    "very crowded": "crowded"
    "dense": "crowded"
    "narrow, crowded": "crowded"
    "close to crowded": "crowded"
    "nearly distant": "subdistant"
    "sparse": "distant"
  similarity_matrix:
    "crowded-close": 0.8
    "close-subdistant": 0.7
    "subdistant-distant": 0.7
    "crowded-subdistant": 0.4
    "crowded-distant": 0.2
    "close-distant": 0.4

# =============================================================================
#  GILL EDGE TEXTURE  [new feature]
# =============================================================================
gill_edge_texture:
  description: >
    The character of the gill margin (lower free edge), best seen with a
    hand lens or under a dissecting microscope. Diagnostic at species level
    in some Lactarius and Russula.
    Source: Senthilarasu & Kumaresan 2018 (CREAM), Largent & Stuntz 1977.
  canonical_values:
    smooth: "Gill edge entire and without interruption or texture"
    serrate: "Gill edge tooth-like with sharp, regular projections"
    eroded: "Gill edge irregularly torn or tattered"
    undulating: "Gill edge broadly and irregularly wavy"
    fimbriate: "Gill edge with fine hair-like or thread-like fringe"
  aliases:
    "entire": "smooth"
    "even": "smooth"
    "toothed": "serrate"
    "saw-edged": "serrate"
    "ragged": "eroded"
    "torn": "eroded"
    "wavy": "undulating"
    "fringed": "fimbriate"
    "hairy edge": "fimbriate"
  similarity_matrix:
    "smooth-undulating": 0.4
    "serrate-eroded": 0.5
    "eroded-fimbriate": 0.4
    "smooth-serrate": 0.2

# =============================================================================
#  STEM SHAPE
# =============================================================================
stem_shape:
  description: >
    The overall form and cross-section of the stipe (stem) in profile.
    Important for distinguishing genera (e.g. bulbous base typical of Amanita).
    Note: where the stipe attaches to the cap (central/eccentric/lateral) is
    a separate feature; see stipe_attachment_position.
    Source: Senthilarasu & Kumaresan 2018 (CREAM), Largent & Stuntz 1977.
  canonical_values:
    equal: "Uniform diameter from base to apex (cylindrical, terete)"
    clavate: "Club-shaped; gradually thickening toward the base"
    obclavate: "Widest at the apex, gradually narrowing toward the base (inverted club)"
    bulbous: "Distinctly and abruptly swollen or bulb-like at the base"
    attenuated: "Diameter gradually reduced toward the apex and/or base (tapering)"
    ventricose: "Swollen in the middle, narrowing at both apex and base"
    compressed: "Laterally flattened, oval or elliptic in cross-section rather than round"
    rooting: "Base extending into a pseudorrhiza, a root-like structure penetrating the substrate"
  aliases:
    "cylindrical": "equal"
    "cylindric": "equal"
    "subcylindric": "equal"
    "club-shaped": "clavate"
    "tapering": "attenuated"
    "tapered base": "attenuated"
    "attenuated toward base": "attenuated"
    "attenuated toward apex": "attenuated"
    "equal to tapering": "equal"
    "slightly swollen at the base": "bulbous"
    "abruptly bulbous": "bulbous"
    "inverted cone": "obclavate"
    "flattened stipe": "compressed"
    "radicated": "rooting"
    "pseudorrhiza": "rooting"
    "slender": "equal"
  similarity_matrix:
    "equal-clavate": 0.5
    "equal-attenuated": 0.5
    "clavate-bulbous": 0.6
    "equal-compressed": 0.4
    "obclavate-clavate": 0.4
    "ventricose-equal": 0.3

# =============================================================================
#  CAP SURFACE MOISTURE  [new feature — split from surface_texture]
# =============================================================================
cap_surface_moisture:
  description: >
    The wetness and stickiness of the cap surface. A distinct dimension from
    surface texture (fibril/scale architecture). Best assessed on fresh specimens
    in natural conditions; viscidity often disappears on drying.
    Source: Senthilarasu & Kumaresan 2018 (CREAM), MushroomExpert.com.
  canonical_values:
    dry: "Not sticky, matte or powdery finish, unchanged by wetting"
    moist: "Slightly damp-looking, hygroscopic but not sticky or slimy"
    subviscid: "Very slightly sticky, barely perceptible on the fingertip"
    viscid: "Distinctly sticky or slimy when touched in moist conditions; gelatinous surface layer present"
    glutinous: "Heavily coated with a thick, liquid glue-like gelatinous substance"
    gelatinous: "Surface with a thickened jelly-like layer (typical of some Suillus, jelly fungi)"
    hygrophanous: "Changes color conspicuously as moisture evaporates; markedly darker when wet, paler when dry"
  aliases:
    "slimy": "glutinous"
    "sticky": "viscid"
    "tacky": "viscid"
    "glassy": "viscid"
    "slippery": "viscid"
    "slightly sticky": "subviscid"
    "watery": "moist"
    "damp": "moist"
    "velvety": "dry"
    "matt": "dry"
    "matte": "dry"
    "not sticky": "dry"
    "changing color with moisture": "hygrophanous"
    "fading on drying": "hygrophanous"
    "water-soaked": "hygrophanous"
  similarity_matrix:
    "dry-moist": 0.5
    "moist-subviscid": 0.6
    "subviscid-viscid": 0.7
    "viscid-glutinous": 0.7
    "glutinous-gelatinous": 0.6
    "moist-hygrophanous": 0.4
    "dry-viscid": 0.1

# =============================================================================
#  SURFACE TEXTURE -- visual and tactile fibril/scale architecture
# =============================================================================
surface_texture:
  description: >
    The tactile and visual architecture of the cap or stem surface, describing
    fibril, scale, hair, and pit structures. Shared vocabulary for both
    cap.surface_texture and stem.surface_texture.
    Note: wetness and stickiness are a separate dimension; see cap_surface_moisture.
    Source: Senthilarasu & Kumaresan 2018 (CREAM), Largent & Stuntz 1977.
  canonical_values:
    smooth: "No surface fibrils, scales, hairs, pits or ornamentation (glabrous)"
    fibrillose: "Covered with fine thread-like fibers (fibrils) arranged radially or irregularly"
    silky: "Fine, closely appressed fibrils giving a silky or satin-like sheen (sericeous)"
    velvety: "Compact, short, fine, soft hairs giving a velvet-like feel (velutinose, pubescent)"
    tomentose: "Densely matted, woolly or felt-like layer of interwoven fibrils"
    floccose: "Loose, cottony tufts or patches on surface; more open and fluffy than tomentose"
    scaly: "Bearing distinct scales, either appressed (squamulose) or erect (imbricate)"
    squarrose: "Scales or fibril-tips erect, spreading, or recurved outward, especially prominent at the disc"
    warty: "Covered with discrete rounded wart-like projections (e.g. Amanita veil remnants on cap)"
    reticulate: "With a raised net-like pattern of ridges (especially on bolete stems)"
    pruinose: "Covered with very fine powder, appearing frosted or dusted with flour (pulverulent)"
    areolate: "Surface cracked into irregular block-like patches, resembling dried mud"
    pitted: "Surface with small rounded depressions or pits (e.g. Morchella cap)"
    wrinkled: "Surface with broad folds or longitudinal ridges (rugose)"
  aliases:
    "bald": "smooth"
    "glabrous": "smooth"
    "more or less bald": "smooth"
    "bald or finely silky": "smooth"
    "hairy": "fibrillose"
    "finely hairy": "fibrillose"
    "silky-fibrillose": "silky"
    "appressed-fibrillose": "silky"
    "sericeous": "silky"
    "finely velvety": "velvety"
    "velutinose": "velvety"
    "pubescent": "velvety"
    "densely woolly": "tomentose"
    "felted": "tomentose"
    "matted-fibrillose": "tomentose"
    "squamulose": "scaly"
    "squamose": "scaly"
    "imbricate-scaly": "scaly"
    "appressed-squamulose": "scaly"
    "recurved-squamulose": "squarrose"
