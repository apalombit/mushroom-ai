    "pendant-double": 0.5

# =============================================================================
#  RING PERSISTENCE  [new feature — split from ring_shape]
# =============================================================================
ring_persistence:
  description: >
    How long the ring remains on the stipe and how firmly it is attached.
    Relevant when the ring may be absent in older specimens; a ring-zone
    may be the only remaining evidence.
    Source: Senthilarasu & Kumaresan 2018 (CREAM), Largent & Stuntz 1977.
  canonical_values:
    persistent: "Ring remains firmly attached and intact throughout the mushroom's lifespan"
    fugacious: "Ring present only in young or fresh specimens; collapses or drops off early"
    ring_zone: "Ring entirely absent but a discolored, fibrillose, or darker zone remains on the stipe surface"
  aliases:
    "fixed": "persistent"
    "remaining": "persistent"
    "durable": "persistent"
    "fragile": "fugacious"
    "evanescent": "fugacious"
    "soon disappearing": "fugacious"
    "falling off": "fugacious"
    "trace only": "ring_zone"
    "zone only": "ring_zone"
    "cortina zone": "ring_zone"
    "ring remnant": "ring_zone"
  similarity_matrix:
    "persistent-fugacious": 0.2
    "fugacious-ring_zone": 0.5
    "persistent-ring_zone": 0.1

# =============================================================================
#  RING POSITION
# =============================================================================
ring_position:
  description: >
    Where the ring sits on the stem. Position helps separate species
    within Amanita, Agaricus, Lepiota, and other ringed genera.
    Source: Senthilarasu & Kumaresan 2018 (CREAM).
  canonical_values:
    superior: "In the upper third of the stem, near the cap"
    median: "Roughly midway along the stem"
    inferior: "In the lower third of the stem, near the base"
    apical: "Very near the top of the stem, immediately below the cap"
  aliases:
    "upper": "superior"
    "near apex": "apical"
    "high on stem": "superior"
    "mid-stem": "median"
    "middle": "median"
    "low": "inferior"
    "near base": "inferior"
  similarity_matrix:
    "apical-superior": 0.8
    "superior-median": 0.5
    "median-inferior": 0.5
    "superior-inferior": 0.2

# =============================================================================
#  RING MOBILITY
# =============================================================================
ring_mobility:
  description: >
    Whether the ring can slide up and down the stem. A movable ring is
    diagnostic for Macrolepiota (parasol mushrooms) and a few Agaricus.
  canonical_values:
    fixed: "Ring firmly attached, does not move along the stipe"
    movable: "Ring can be slid up and down the stipe freely"
  aliases:
    "immovable": "fixed"
    "attached": "fixed"
    "sliding": "movable"
    "free-sliding": "movable"
    "loose": "movable"
  similarity_matrix:
    "fixed-movable": 0.0

# =============================================================================
#  GROWTH HABIT  [new feature]
# =============================================================================
growth_habit:
  description: >
    The spatial arrangement of individual fruiting bodies relative to each
    other. Important for distinguishing species with similar morphology that
    differ in growth pattern (e.g. Armillaria vs Galerina, Hypholoma vs Psilocybe).
    Source: Senthilarasu & Kumaresan 2018 (CREAM).
  canonical_values:
    solitary: "Single fruiting body growing alone, with no nearby conspecifics"
    scattered: "Several fruiting bodies spread apart, individually arising but in the same general area"
    gregarious: "Multiple fruiting bodies growing close together, each arising separately from the substrate without a shared base"
    caespitose: "Tight cluster of fruiting bodies sharing a common base or arising from the same point in the substrate"
    connate: "Stipes of two or more fruiting bodies fused together at the base"
  aliases:
    "alone": "solitary"
    "single": "solitary"
    "grouped": "gregarious"
    "in groups": "gregarious"
    "in troops": "gregarious"
    "in large numbers": "gregarious"
    "clustered": "caespitose"
    "in clusters": "caespitose"
    "tufted": "caespitose"
    "fasciculate": "caespitose"
    "fused at base": "connate"
  similarity_matrix:
    "scattered-gregarious": 0.6
    "gregarious-caespitose": 0.5
    "caespitose-connate": 0.7
    "solitary-scattered": 0.4
    "gregarious-solitary": 0.2

# =============================================================================
#  LATEX  [new feature]
# =============================================================================
latex:
  description: >
    Whether the flesh exudes a latex (milk) when cut or broken, and if so
    its color and behavior on exposure to air. Latex is the defining
    character of the genus Lactarius; its color, abundance, and change
    on exposure are critical for species-level identification.
    Source: Largent & Stuntz 1977, MushroomExpert.com.
  canonical_values:
    absent: "No latex exuded when cut; flesh dry"
    white: "White latex that does not change color on exposure to air"
    white_to_yellow: "Latex initially white, slowly turning yellow or sulphur-yellow on exposure (Lactarius chrysorrheus)"
    white_to_lilac: "Latex initially white, slowly turning lilac or violet (some Lactarius species)"
    watery: "Watery, colorless or very pale transparent latex"
    blue: "Blue latex from the moment of cutting (Lactarius indigo)"
    red: "Red or blood-red latex (Lactarius sanguifluus, L. deliciosus group)"
    orange: "Orange or carrot-colored latex (Lactarius deliciosus group)"
  aliases:
    "no milk": "absent"
    "no latex": "absent"
    "dry flesh": "absent"
    "milky": "white"
    "white milk": "white"
    "copious white latex": "white"
    "white turning yellow": "white_to_yellow"
    "clear": "watery"
    "transparent": "watery"
    "colorless": "watery"
    "blue milk": "blue"
    "indigo milk": "blue"
    "red milk": "red"
    "blood red latex": "red"
    "carrot-colored": "orange"
    "saffron-colored": "orange"
  similarity_matrix:
    "white-watery": 0.3
    "white-white_to_yellow": 0.5
    "white-white_to_lilac": 0.5
    "red-orange": 0.5
    "blue-absent": 0.0
    "white-absent": 0.0

# =============================================================================
#  PILEIPELLIS TYPE (microscopic)
# =============================================================================
pileipellis_type:
  description: >
    The microscopic structure of the cap skin (pileipellis). Important for
    species-level taxonomy in many genera.
  canonical_values:
    cutis: "Hyphae lying parallel to cap surface in a thin layer"
    ixocutis: "Cutis embedded in a gelatinous matrix (slimy caps)"
    trichoderm: "Hyphae standing erect or tangled, perpendicular to surface"
    ixotrichoderm: "Trichoderm in a gelatinous matrix"
    hymeniderm: "Rounded, club-shaped terminal cells forming a palisade layer"
    epithelium: "Rounded, isodiametric cells forming a cobblestone-like layer"
  aliases:
    "cutis or an ixocutis": "cutis"
    "cutis or ixocutis": "cutis"
    "interwoven septate hyphae": "cutis"
    "branched erect hyphae": "trichoderm"
    "densely tangled layer of clamped, cylindric hyphae": "trichoderm"
    "pseudo-parenchymatic": "epithelium"
    "cellular": "epithelium"
  similarity_matrix:
    "cutis-ixocutis": 0.7
    "trichoderm-ixotrichoderm": 0.7
    "cutis-trichoderm": 0.3
    "hymeniderm-epithelium": 0.5
