# =============================================================================
#  FLESH TEXTURE
# =============================================================================
flesh_texture:
  description: >
    The consistency of the flesh when cut or broken. Diagnostic for some
    groups (e.g. brittle chalk-snap flesh is characteristic of Russulaceae).
    Source: Senthilarasu & Kumaresan 2018 (CREAM), MushroomExpert.com.
  canonical_values:
    firm: "Dense, holds shape when pressed (meaty)"
    soft: "Easily compressed, yielding"
    brittle: "Snaps cleanly like chalk without fibrous tearing (granular; Russulaceae)"
    fragile: "Very thin, easily damaged or crumbled"
    fibrous: "Stringy, tears into fibers rather than breaking cleanly"
    cartilaginous: "Tough, rubbery, flexible like cartilage; bends considerably before breaking"
    waxy: "Smooth, slightly greasy or translucent consistency (Hygrophorus, Hygrocybe)"
    gelatinous: "Jelly-like, soft and elastic or translucent (some Cortinarius, Suillus, Tremella)"
    woody: "Very hard, wood-like and resistant to breaking (perennial polypores, bracket fungi)"
  aliases:
