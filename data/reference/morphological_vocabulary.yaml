    "stuffed-solid": 0.5
    "hollow-solid": 0.0

# =============================================================================
#  STIPE ATTACHMENT POSITION  [new feature]
# =============================================================================
stipe_attachment_position:
  description: >
    Where the stipe attaches to the underside of the cap. Lateral attachment
    is diagnostic for Pleurotus, Crepidotus, Panus, and other genera growing
    on wood or bark. Absent indicates a sessile (stalkless) fruiting body.
    Source: Senthilarasu & Kumaresan 2018 (CREAM).
  canonical_values:
    central: "Stipe attached at the geometric center of the cap"
    eccentric: "Stipe attached off-center, between the center and the margin"
    lateral: "Stipe attached at or very close to the cap margin"
    absent: "No stipe present; cap attached directly to the substrate (sessile)"
  aliases:
    "centrally attached": "central"
    "off-center": "eccentric"
    "off-centre": "eccentric"
    "excentric": "eccentric"
