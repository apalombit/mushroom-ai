    "smooth margin": "entire"
    "translucent-striate": "striate"
    "pellucid-striate": "striate"
    "ragged": "split"
    "frayed": "fringed"
    "ciliate": "fringed"
    "upturned": "uplifted"
    "revolute": "uplifted"
    "turned up": "uplifted"
  similarity_matrix:
