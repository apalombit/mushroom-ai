veil_type:
  description: >
    The type of veil tissue present. Universal veils enclose the entire
    young fruiting body; partial veils cover only the gills.
    Both may be present simultaneously, notably in Amanita.
    Source: Senthilarasu & Kumaresan 2018 (CREAM), Largent & Stuntz 1977.
  canonical_values:
    partial: "Tissue connecting cap margin to stem, covering gills in young specimens; leaves annulus on stem"
    universal: "Tissue enclosing entire young fruiting body; leaves volva at base and/or patches on cap"
    cortina: "Cobweb-like partial veil of fine silky fibers (Cortinarius); leaves a fibrous zone or ring-zone on the stem"
    both: "Universal and partial veil both present simultaneously (notably Amanita phalloides group)"
    absent: "No veil tissue present"
  aliases:
    "ring": "partial"
