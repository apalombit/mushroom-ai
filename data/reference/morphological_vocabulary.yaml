# =============================================================================
#  FLESH HYPHAL STRUCTURE (microscopic)
# =============================================================================
flesh_hyphal_structure:
  description: >
    The cellular architecture of the flesh (trama). Determined by examining
    a thin section under microscope. The presence of sphaerocysts (round
    inflated cells) versus only elongated hyphae is the defining character
    of Russulaceae and directly causes the brittle chalk-like snap texture.
  canonical_values:
    homoiomerous: "Flesh composed entirely of elongated, interwoven hyphae (typical of most agarics)"
    heteromerous: "Flesh containing nests of sphaerocysts (round inflated cells) among elongated hyphae (Russulaceae)"
  aliases:
    "regular hyphae": "homoiomerous"
    "filamentous": "homoiomerous"
    "interwoven hyphae only": "homoiomerous"
    "with sphaerocysts": "heteromerous"
    "with nests of round cells": "heteromerous"
    "brittle-fleshed": "heteromerous"
    "russuloid": "heteromerous"
  similarity_matrix:
    "homoiomerous-heteromerous": 0.0

# =============================================================================
#  FLESH CAP-STEM CONSISTENCY
# =============================================================================
flesh_cap_stem_consistency:
  description: >
    Whether the flesh in the cap and stem share the same texture and
    structure. In some genera (e.g. Russula) the cap is brittle/granular
    while the stem is more fibrous; in others (e.g. most Agaricus) both
    are uniformly firm throughout.
  canonical_values:
    homogeneous: "Cap and stem flesh are the same texture and structure throughout"
    heterogeneous: "Cap and stem flesh differ noticeably in texture or structure"
  aliases:
    "uniform": "homogeneous"
    "same throughout": "homogeneous"
    "continuous": "homogeneous"
    "different in cap and stem": "heterogeneous"
    "cap brittle, stem fibrous": "heterogeneous"
    "cap granular, stem fibrous": "heterogeneous"
  similarity_matrix:
    "homogeneous-heterogeneous": 0.0

# =============================================================================
#  SPORE SHAPE
# =============================================================================
spore_shape:
  description: >
    The shape of basidiospores or ascospores under microscopy. Fundamental
    for genus-level taxonomy. Shape is often described by the length:width
    ratio (Q value).
  canonical_values:
    globose: "Spherical; Q = 1.0-1.05"
    subglobose: "Nearly spherical; Q = 1.05-1.15"
    broadly_ellipsoid: "Wide oval; Q = 1.15-1.3"
    ellipsoid: "Oval/elliptical; Q = 1.3-1.6"
    oblong: "Elongated oval; Q = 1.6-2.0"
    cylindric: "Rod-shaped; Q > 2.0"
    fusiform: "Spindle-shaped, tapered at both ends"
    amygdaliform: "Almond-shaped, pointed at one end"
    ovoid: "Egg-shaped, broader at one end"
    lacrymoid: "Teardrop-shaped"
  aliases:
    "ellipsoidal": "ellipsoid"
    "elliptical": "ellipsoid"
    "egg-shaped": "ovoid"
    "spherical": "globose"
    "round": "globose"
    "roughly spherical to broadly egg-shaped": "subglobose"
    "broadly ellipsoid": "broadly_ellipsoid"
    "subglobose to broadly ellipsoid": "broadly_ellipsoid"
    "ellipsoid to ovoid": "ellipsoid"
    "pip-shaped": "amygdaliform"
    "almond-shaped": "amygdaliform"
  similarity_matrix:
    "globose-subglobose": 0.9
    "subglobose-broadly_ellipsoid": 0.8
    "broadly_ellipsoid-ellipsoid": 0.8
    "ellipsoid-oblong": 0.7
    "oblong-cylindric": 0.7
    "ellipsoid-ovoid": 0.7
    "ellipsoid-amygdaliform": 0.6
    "fusiform-cylindric": 0.5
    "fusiform-amygdaliform": 0.5
    "ovoid-lacrymoid": 0.6
    "globose-ellipsoid": 0.5

# =============================================================================
#  SPORE ORNAMENTATION
# =============================================================================
spore_ornamentation:
  description: >
    Surface sculpture of spores under high-power microscopy or SEM.
    Diagnostic for many genera (e.g. echinulate in Laccaria, reticulate
    in some Boletus).
  canonical_values:
    smooth: "No surface ornamentation"
    verrucose: "Covered with small wart-like bumps"
    echinulate: "Bearing small spines or prickles"
    reticulate: "With a net-like pattern of ridges"
    ridged: "With longitudinal or irregular raised ridges"
    striate: "With fine parallel lines or grooves"
    punctate: "With fine dots or pits"
  aliases:
    "warty": "verrucose"
    "warts": "verrucose"
    "moderately verrucose": "verrucose"
    "finely verrucose": "verrucose"
    "strongly warted": "verrucose"
    "spiny": "echinulate"
    "thin-lined": "striate"
    "smooth to finely roughened": "smooth"
    "amyloid": "verrucose"
  similarity_matrix:
    "verrucose-echinulate": 0.6
    "verrucose-punctate": 0.5
    "ridged-reticulate": 0.6
    "ridged-striate": 0.6

# =============================================================================
#  SPORE AMYLOIDITY
# =============================================================================
spore_amyloidity:
  description: >
    Reaction of spore walls to Melzer's reagent (iodine-based). A key
    microscopic character for higher-level taxonomy.
  canonical_values:
    amyloid: "Spore walls turn blue-black in Melzer's reagent"
    inamyloid: "No reaction to Melzer's reagent"
    dextrinoid: "Spore walls turn reddish-brown in Melzer's reagent"
  aliases:
    "hyaline to yellowish in KOH": "inamyloid"
  similarity_matrix:
    "amyloid-dextrinoid": 0.3
    "amyloid-inamyloid": 0.0
    "dextrinoid-inamyloid": 0.3

# =============================================================================
#  VEIL TYPE
# =============================================================================
veil_type:
  description: >
    The type of veil tissue present. Universal veils enclose the entire
    young fruiting body; partial veils cover only the gills.
  canonical_values:
    partial: "Tissue connecting cap margin to stem, covering gills in young specimens"
    universal: "Tissue enclosing entire young fruiting body (leaves volva + cap patches)"
    cortina: "Cobweb-like partial veil of fine silky fibers (Cortinarius)"
    absent: "No veil tissue present"
  aliases:
    "ring": "partial"
    "annulus": "partial"
  similarity_matrix:
    "partial-cortina": 0.5
    "partial-universal": 0.3
    "cortina-absent": 0.2
    "partial-absent": 0.0
    "universal-absent": 0.0

# =============================================================================
#  VOLVA TYPE
# =============================================================================
volva_type:
  description: >
    The form of the volva (basal cup), a remnant of the universal veil.
    Present in Amanita, Volvariella, and a few other genera. One of the
    most critical safety-relevant features — a saccate volva combined with
    a ring strongly suggests Amanita sect. Phalloideae (deadly).
  canonical_values:
    saccate: "Sac-like or cup-shaped with a distinct free margin (classic Amanita volva)"
    sheathing: "Close-fitting, sock-like, tightly wrapping the stem base"
    friable: "Breaking into rings, patches, or scales around the bulb base"
    napiform: "Forming a turnip-shaped swelling at the stem base with adhering patches"
    absent: "No volva present"
  aliases:
    "sac-like": "saccate"
    "cup-shaped": "saccate"
    "bag-like": "saccate"
    "membranous cup": "saccate"
    "free cup": "saccate"
    "sock-like": "sheathing"
    "close-fitting": "sheathing"
    "scaly rings": "friable"
    "rings of scales": "friable"
    "concentric rings": "friable"
    "patches on bulb": "friable"
    "turnip-shaped bulb": "napiform"
    "bulbous with adhering scales": "napiform"
  similarity_matrix:
    "saccate-sheathing": 0.5
    "saccate-friable": 0.2
    "sheathing-friable": 0.3
    "napiform-friable": 0.5
    "saccate-absent": 0.0
    "sheathing-absent": 0.0
    "friable-absent": 0.0

# =============================================================================
#  RING (ANNULUS) SHAPE
# =============================================================================
ring_shape:
  description: >
    The shape and form of the annulus (ring) on the stem. The ring is a
    remnant of the partial veil and its form helps distinguish genera
    and species (e.g. double ring in Agaricus sect. Arvenses).
  canonical_values:
    pendant: "Hanging skirt-like from upper stem, free margin pointing downward"
    ascending: "Attached low, flaring upward along the stem"
    flaring: "Spreading outward like a collar or funnel"
    sheathing: "Forming a tight sleeve around the stem"
    double: "Two-layered ring (inner + outer layer), characteristic of Agaricus sect. Arvenses"
    fragile: "Thin, easily lost or visible only as fragments"
    cobwebby: "Cortina remnant; silky web-like zone on stem"
    absent: "No ring present"
  aliases:
    "skirt-like": "pendant"
    "superior ring": "pendant"
    "membranous and pendant": "pendant"
    "membranous": "pendant"
    "upward-flaring": "ascending"
    "collar-like": "flaring"
    "double ring": "double"
    "two-layered": "double"
    "cogwheel ring": "double"
    "fugacious": "fragile"
    "evanescent": "fragile"
    "cortina zone": "cobwebby"
    "cortina remnant": "cobwebby"
  similarity_matrix:
    "pendant-flaring": 0.5
    "pendant-ascending": 0.4
    "pendant-sheathing": 0.3
    "flaring-ascending": 0.5
    "fragile-cobwebby": 0.4
    "pendant-double": 0.5
    "fragile-absent": 0.5

# =============================================================================
#  RING POSITION
# =============================================================================
ring_position:
  description: >
    Where the ring sits on the stem. Position helps separate species
    within Amanita, Agaricus, Lepiota, and other ringed genera.
  canonical_values:
    superior: "In the upper third of the stem, near the cap"
    median: "Roughly midway along the stem"
    inferior: "In the lower third of the stem, near the base"
    apical: "Very near the top of the stem, immediately below the cap"
  aliases:
    "upper": "superior"
    "near apex": "apical"
    "high on stem": "superior"
    "mid-stem": "median"
    "middle": "median"
    "low": "inferior"
    "near base": "inferior"
  similarity_matrix:
    "apical-superior": 0.8
    "superior-median": 0.5
    "median-inferior": 0.5
    "superior-inferior": 0.2

# =============================================================================
#  RING MOBILITY
# =============================================================================
ring_mobility:
  description: >
    Whether the ring can slide up and down the stem. A movable ring is
    diagnostic for Macrolepiota (parasol mushrooms) and a few Agaricus.
  canonical_values:
    fixed: "Ring firmly attached, does not move"
    movable: "Ring can be slid up and down the stem freely"
  aliases:
    "immovable": "fixed"
    "attached": "fixed"
    "sliding": "movable"
    "free-sliding": "movable"
    "loose": "movable"
  similarity_matrix:
    "fixed-movable": 0.0

# =============================================================================
#  PILEIPELLIS TYPE (microscopic)
# =============================================================================
pileipellis_type:
  description: >
    The microscopic structure of the cap skin (pileipellis). Important for
    species-level taxonomy in many genera.
  canonical_values:
    cutis: "Hyphae lying parallel to cap surface in a thin layer"
    ixocutis: "Cutis embedded in a gelatinous matrix (slimy caps)"
    trichoderm: "Hyphae standing erect or tangled, perpendicular to surface"
    ixotrichoderm: "Trichoderm in a gelatinous matrix"
    hymeniderm: "Rounded, club-shaped terminal cells forming a palisade layer"
    epithelium: "Rounded, isodiametric cells forming a cobblestone-like layer"
  aliases:
    "cutis or an ixocutis": "cutis"
    "cutis or ixocutis": "cutis"
    "interwoven septate hyphae": "cutis"
    "peli articulated and branched": "trichoderm"
    "pseudo-parenchymatic": "epithelium"
    "densely tangled layer of clamped, cylindric hyphae": "trichoderm"
  similarity_matrix:
    "cutis-ixocutis": 0.7
    "trichoderm-ixotrichoderm": 0.7
    "cutis-trichoderm": 0.3
    "hymeniderm-epithelium": 0.5
