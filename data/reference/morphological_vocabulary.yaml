# Morphological Feature Vocabulary
#
# Canonical terms and aliases for normalizing qualitative morphological features
# before similarity comparison. Grounded in standard mycological terminology.
#
# Structure per feature:
#   description:       what the feature represents
#   canonical_values:  { term: definition }
#   aliases:           { variant_wording: canonical_term }
#   similarity_matrix: { "termA-termB": score }  (optional, 0.0-1.0)
#
# Sources: Wikipedia (Mycology glossary), MushroomExpert.com, NYBG Glossary,
#          Mycology Start, Great Lakes Data Terms, field guide conventions.

# =============================================================================
#  HYMENIUM TYPE -- the single most diagnostic macro feature
# =============================================================================
hymenium_type:
  description: >
    The spore-bearing surface type. Determines the fundamental body plan of the
    fruiting body and is the first-level split in most field identification keys.
  canonical_values:
    gills: "Blade-like lamellae radiating from the stem (most agarics)"
    ridges: "Blunt, forking, vein-like folds that cannot be separated from the cap flesh (chanterelles)"
    pores: "Sponge-like openings on the cap underside, the mouths of vertical tubes (boletes, polypores)"
    teeth: "Hanging spine-like or tooth-like projections (Hydnum, Hericium)"
    smooth: "No differentiated spore-bearing surface; spores produced internally or on a smooth surface (puffballs, earthstars)"
  aliases:
    "lamellae": "gills"
    "false gills": "ridges"
    "veins": "ridges"
    "tubes": "pores"
    "spines": "teeth"
    "spikes": "teeth"
    "gleba": "smooth"
  similarity_matrix:
    # Forager-confusion likelihood: how often these get visually confused
    "gills-ridges": 0.7      # classic chanterelle vs jack-o-lantern confusion
    "gills-teeth": 0.15
    "gills-pores": 0.1
    "gills-smooth": 0.0
    "ridges-teeth": 0.2
    "ridges-pores": 0.05
    "ridges-smooth": 0.0
    "pores-teeth": 0.1
    "pores-smooth": 0.0
    "teeth-smooth": 0.0

# =============================================================================
#  OVERALL BODY FORM -- the broadest macro character
# =============================================================================
overall_body_form:
  description: >
    The gross morphological plan of the fruiting body. The single broadest
    macro character, grouping species by body architecture before any finer
    feature is considered.
  canonical_values:
    agaricoid: "Cap-and-stem with gills (classic mushroom shape)"
    boletoid: "Cap-and-stem with pores/tubes instead of gills"
    cantharelloid: "Cap-and-stem with blunt ridges/false gills instead of true gills"
    hydnoid: "Bearing teeth or spines as the spore-bearing surface (tooth fungi)"
    polyporoid: "Bracket- or shelf-like, typically on wood, with pores"
    gasteroid: "Spores produced internally; outer wall encloses a spore mass (puffballs, earthstars, stinkhorns)"
    clavarioid: "Club-shaped or coral-like, upright branching"
    corticioid: "Crust-like, flat against substrate, resupinate"
    secotioid: "Intermediate between agaricoid and gasteroid; cap may not fully expand"
    hypogeous: "Fruiting underground (truffles, false truffles)"
  aliases:
    "mushroom-shaped": "agaricoid"
    "classic mushroom": "agaricoid"
    "toadstool": "agaricoid"
    "bolete-shaped": "boletoid"
    "bolete": "boletoid"
    "chanterelle-shaped": "cantharelloid"
    "puffball": "gasteroid"
    "earthstar": "gasteroid"
    "stinkhorn": "gasteroid"
    "coral fungus": "clavarioid"
    "club-shaped fruiting body": "clavarioid"
    "bracket": "polyporoid"
    "shelf fungus": "polyporoid"
    "polypore": "polyporoid"
    "conk": "polyporoid"
    "crust": "corticioid"
    "resupinate": "corticioid"
    "tooth fungus": "hydnoid"
    "truffle": "hypogeous"
    "truffle-like": "hypogeous"
  similarity_matrix:
    "agaricoid-cantharelloid": 0.7
    "agaricoid-boletoid": 0.6
    "agaricoid-secotioid": 0.5
    "boletoid-polyporoid": 0.4
    "gasteroid-secotioid": 0.5
    "gasteroid-hypogeous": 0.4
    "hydnoid-cantharelloid": 0.3
    "clavarioid-corticioid": 0.2

# =============================================================================
#  CAP SHAPE
# =============================================================================
cap_shape:
  description: >
    The overall shape of the pileus (cap) in profile. Shape often changes with
    maturity -- the canonical value should represent the typical mature form.
  canonical_values:
    convex: "Broadly rounded, dome-shaped"
    flat: "Plane, horizontally spread with little curvature"
    conical: "Cone-shaped, sharply pointed or narrowing upward"
    campanulate: "Bell-shaped; taller than wide, rounded at apex"
    umbonate: "Flat or convex with a distinct central knob (umbo)"
    depressed: "Sunken or concave at the center, raised at margins"
    infundibuliform: "Funnel-shaped; deeply depressed center with upturned margins"
    irregular: "No consistent geometric shape; wavy, lobed, or asymmetric"
    globose: "Spherical or nearly so (typical of puffballs, young Agaricus)"
    ovoid: "Egg-shaped, taller than wide (typical of young ink caps)"
  aliases:
    "broadly convex": "convex"
    "hemispherical": "convex"
    "round": "globose"
    "spherical": "globose"
    "round to irregularly convex": "convex"
    "convex to broadly convex": "convex"
    "convex to spherical when young, becoming broadly convex or nearly flat in age": "convex"
    "hemispherical then plano-convex": "convex"
    "plano-convex": "flat"
    "plane": "flat"
    "applanate": "flat"
    "flattened": "flat"
    "flattened to depressed": "depressed"
    "funnel-shaped": "infundibuliform"
    "conic": "conical"
    "conic to broadly conical": "conical"
    "bell-shaped": "campanulate"
    "umbrella-shaped": "flat"
    "egg-shaped": "ovoid"
    "bullet-shaped": "ovoid"
  similarity_matrix:
    "convex-flat": 0.7         # common maturation progression
    "convex-campanulate": 0.5
    "convex-umbonate": 0.6
    "convex-globose": 0.5
    "convex-depressed": 0.3
    "flat-depressed": 0.6
    "flat-infundibuliform": 0.4
    "depressed-infundibuliform": 0.8
    "conical-campanulate": 0.7
    "conical-umbonate": 0.5
    "campanulate-ovoid": 0.5
    "globose-ovoid": 0.7

