# =============================================================================
#  CAP MARGIN
# =============================================================================
cap_margin:
  description: >
    The character of the cap edge. Encompasses both the direction the margin
    curves (inrolled, incurved, decurved, uplifted) and the surface/outline
    character of the edge itself (entire, striate, appendiculate, etc.).
    Useful for distinguishing species within a genus and indicating maturity.
    Source: Senthilarasu & Kumaresan 2018 (CREAM), Largent & Stuntz 1977.
  canonical_values:
    inrolled: "Margin rolled inward toward itself; the very tip curls back under (involute)"
    incurved: "Margin curved toward the gills but not rolled back on itself; less extreme than inrolled"
    decurved: "Margin curving downward toward the stipe, between incurved and plane"
    entire: "Margin smooth, regular, and uninterrupted in outline"
    wavy: "Margin broadly and irregularly undulating (undulate, crenulate)"
    striate: "Margin with fine radial lines or grooves due to underlying gill positions (translucent-striate when wet)"
    appendiculate: "Margin with hanging remnants of the partial veil at the edge"
    rimose: "Margin with radial splits or cracks running inward toward the disc"
    split: "Margin cracked or torn irregularly with age"
    lobed: "Margin divided into broad, rounded sections"
    fringed: "Margin with fine frayed or hair-like appendages (ciliate)"
    uplifted: "Margin turned upward with age (upturned, revolute)"
  aliases:
    "rolled under": "inrolled"
    "involute": "inrolled"
    "rolled inward": "inrolled"
    "irregularly wavy": "wavy"
    "undulate": "wavy"
