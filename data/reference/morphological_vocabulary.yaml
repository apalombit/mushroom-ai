spore_print_color:
  description: >
    The color of a mass of deposited spores on paper. One of the single most
    important field identification characters. Collected by placing the cap
    gill-side down on white and dark paper for several hours. Canonical values
    represent genus-level groupings.
    NOTE: 'ochre' here means the cinnamon-to-rust-brown range characteristic of
    Cortinarius and related genera -- not the pale sandy-tan meaning ochre carries
    in the general color_palette feature. Do not cross-normalize these two features.
    Source: Largent & Stuntz 1977, Lodge et al. 2004, MushroomExpert.com.
  canonical_values:
    white: "White to whitish spore deposit (Amanita, Tricholoma, Lepiota, Marasmius)"
    cream: "Cream, buff, or pale yellow spore deposit (Cantharellus, some Russula)"
    pink: "Pink, salmon, or flesh-colored spore deposit (Pluteus, Entoloma, Clitopilus)"
    ochre: "Ochre, rust, or cinnamon-brown spore deposit (Cortinarius, Pholiota, Inocybe)"
    brown: "Medium to dark brown spore deposit (Agaricus, Galerina, some Boletus)"
    purple_brown: "Purple-brown, chocolate, or dark vinaceous-brown spore deposit (Stropharia, Hypholoma, Psilocybe)"
    black: "Black or very dark grey-black spore deposit (Coprinoid fungi, Pisolithus)"
    green: "Olive-green spore deposit (Chlorophyllum, Lepiota cristata)"
    yellow: "Bright yellow spore deposit (rare; some Bolbitius)"
  aliases:
