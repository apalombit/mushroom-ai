# =============================================================================
#  BRUISING / COLOR CHANGE -- shared vocabulary for all bruising fields
# =============================================================================
bruising_color:
  description: >
    Color change vocabulary for all bruising and oxidation reactions (flesh
    on cutting, cap on handling, stem on rubbing, pore surface on pressing).
    The same canonical palette applies to flesh.bruising_color,
    cap.bruising_color, stem.bruising_color, and pores.bruising_color.
  canonical_values:
    none: "No color change; flesh/surface remains the same color"
    blue: "Rapidly or slowly turning blue (oxidation of variegatic/pulvinic acid derivatives)"
    blue_green: "Turning blue-green or teal"
    black: "Darkening to black or near-black"
    brown: "Turning brown or brownish"
    red: "Turning red, reddish, or pinkish-red"
    yellow: "Turning yellow or bright yellow"
    orange: "Turning orange or reddish-orange"
    pink: "Turning pink or salmon"
    grey: "Turning grey or greyish"
    green: "Turning green (distinct from blue-green)"
  aliases:
    "no change": "none"
    "unchanged": "none"
    "not staining": "none"
    "not bluing": "none"
    "no bruising": "none"
    "bluing": "blue"
    "instantly blue": "blue"
    "slowly blue": "blue"
    "blue-black": "blue"
    "stains blue": "blue"
    "turns blue when cut": "blue"
    "bluing then blackening": "black"
    "blackening": "black"
    "darkening": "black"
    "slowly brownish": "brown"
    "orangish-brown": "brown"
    "rusty": "brown"
    "slowly brown": "brown"
    "reddening": "red"
    "slowly reddish": "red"
    "turns red": "red"
    "stains red": "red"
    "yellowing": "yellow"
    "chrome yellow": "yellow"
    "stains yellow": "yellow"
    "pinkish": "pink"
    "greying": "grey"
  similarity_matrix:
    "blue-blue_green": 0.7
    "blue-black": 0.4
    "blue-green": 0.5
    "red-pink": 0.6
    "red-orange": 0.5
    "brown-black": 0.5
    "brown-orange": 0.4
    "yellow-orange": 0.5
    "grey-black": 0.5
    "none-brown": 0.1     # very faint browning can be ambiguous with "none"

# =============================================================================
#  GILL ATTACHMENT
# =============================================================================
gill_attachment:
  description: >
    How the gills connect to the stem. A primary diagnostic feature for gilled
    mushrooms, often the first character checked after confirming gills are present.
  canonical_values:
    free: "Gills do not reach or touch the stem"
    adnate: "Gills broadly attached to the stem at full width"
    adnexed: "Gills narrowly attached, curving up slightly before meeting stem"
    decurrent: "Gills run down the stem below the cap-stem junction"
    sinuate: "Gills notched or scooped out just before attaching to stem (also: emarginate)"
    seceding: "Initially attached but breaking away from stem with age"
  aliases:
    "attached": "adnate"
    "attached to the stem": "adnate"
    "free from the stem or slightly attached to it": "free"
    "adnate to adnexed": "adnexed"
    "adnate to adnexed or seceding to free": "seceding"
    "adnate to decurrent": "decurrent"
    "subdecurrent": "decurrent"
    "emarginate": "sinuate"
    "notched": "sinuate"
  similarity_matrix:
    "free-adnexed": 0.4
    "adnate-adnexed": 0.8
    "adnate-decurrent": 0.5
    "adnate-sinuate": 0.6
    "adnexed-sinuate": 0.5
    "decurrent-adnate": 0.5
    "free-sinuate": 0.3

# =============================================================================
#  GILL SPACING
# =============================================================================
gill_spacing:
  description: >
    The density of gills around the cap margin. Assessed by counting gills
    per centimeter at the cap margin or by visual impression.
  canonical_values:
    crowded: "Gills very close together, many per cm"
    close: "Gills moderately spaced, typical density"
    subdistant: "Gills somewhat spaced apart"
    distant: "Gills widely spaced, few per cm"
  aliases:
    "very crowded": "crowded"
    "dense": "crowded"
    "narrow, crowded": "crowded"
    "close to crowded": "crowded"
    "nearly distant": "subdistant"
    "sparse": "distant"
  similarity_matrix:
    "crowded-close": 0.8
    "close-subdistant": 0.7
    "subdistant-distant": 0.7
    "crowded-subdistant": 0.4
    "crowded-distant": 0.2
    "close-distant": 0.4

# =============================================================================
#  STEM SHAPE
# =============================================================================
stem_shape:
  description: >
    The overall form of the stipe (stem) in profile. Important for
    distinguishing genera (e.g. bulbous base typical of Amanita).
  canonical_values:
    equal: "Uniform diameter from base to apex (cylindrical)"
    clavate: "Club-shaped; thicker at the base, tapering upward"
    bulbous: "Distinctly swollen or bulb-like at the base"
    tapering: "Narrowing toward the base"
    ventricose: "Swollen in the middle, narrowing at both ends"
    rooting: "Base extends into a root-like structure below ground"
    slender: "Thin and elongated relative to cap size"
  aliases:
    "cylindrical": "equal"
    "cylindric": "equal"
    "subcylindric": "equal"
    "club-shaped": "clavate"
    "tapered base": "tapering"
    "equal to tapering": "equal"
    "slightly swollen at the base": "bulbous"
    "inverted cone": "tapering"
  similarity_matrix:
    "equal-clavate": 0.5
    "equal-tapering": 0.5
    "equal-slender": 0.7
    "clavate-bulbous": 0.6
    "tapering-slender": 0.5

# =============================================================================
#  SURFACE TEXTURE -- shared vocabulary for cap and stem surfaces
# =============================================================================
surface_texture:
  description: >
    The tactile and visual texture of the cap or stem surface. Shared
    vocabulary used for both cap.surface_texture and stem.surface_texture.
  canonical_values:
    smooth: "Glabrous, without any texture or ornamentation"
    viscid: "Slimy or sticky when moist, with a gelatinous surface layer"
    dry: "Not sticky, matte finish"
    fibrillose: "Covered with fine thread-like fibers (fibrils)"
    scaly: "Bearing distinct scales (squamules or larger scales)"
    velvety: "Finely pubescent, like velvet to the touch"
    silky: "With a silky sheen, fine appressed fibrils"
    warty: "Covered with wart-like projections (e.g. Amanita veil remnants)"
    reticulate: "With a net-like pattern (especially on bolete stems)"
    powdery: "Covered with a fine dust-like or pruinose coating"
    pitted: "Surface with small depressions or pits (e.g. Morchella)"
    wrinkled: "Surface with folds or wrinkles, rugose"
  aliases:
    "bald": "smooth"
    "glabrous": "smooth"
    "more or less bald": "smooth"
    "bald or finely silky": "smooth"
    "slimy": "viscid"
    "sticky": "viscid"
    "glutinous": "viscid"
    "hairy": "fibrillose"
    "finely hairy": "fibrillose"
    "fibrous": "fibrillose"
    "silky-fibrillose": "silky"
    "finely velvety": "velvety"
    "tomentose": "velvety"
    "squamulose": "scaly"
    "squamose": "scaly"
    "smooth to finely silky or a little scaly": "smooth"
    "spiny": "warty"
    "pruinose": "powdery"
    "farinose": "powdery"
  similarity_matrix:
    "smooth-dry": 0.7
    "smooth-silky": 0.7
    "smooth-velvety": 0.4
    "viscid-smooth": 0.3
    "fibrillose-silky": 0.7
    "fibrillose-scaly": 0.5
    "scaly-warty": 0.5
    "velvety-silky": 0.6
    "powdery-velvety": 0.4

# =============================================================================
#  CAP MARGIN TYPE
# =============================================================================
cap_margin:
  description: >
    The character of the cap edge. Useful for distinguishing species within
    a genus and indicating maturity stage.
  canonical_values:
    inrolled: "Margin curved inward toward the gills (involute)"
    even: "Smooth and regular, not distinctly modified"
    wavy: "Undulating or irregularly curved margin"
    striate: "With fine radial lines visible at the margin"
    appendiculate: "With hanging remnants of the partial veil at margin edge"
    split: "Cracked or torn with age"
    lobed: "Divided into broad rounded sections"
    fringed: "With fine frayed or hairy edge"
  aliases:
    "incurved": "inrolled"
    "rolled under": "inrolled"
    "involute": "inrolled"
    "irregularly wavy": "wavy"
    "knobbly": "wavy"
    "ragged": "split"
    "frayed": "fringed"
  similarity_matrix:
    "inrolled-even": 0.4
    "even-wavy": 0.5
    "wavy-lobed": 0.6
    "striate-even": 0.5
    "split-fringed": 0.5

# =============================================================================
#  STEM INTERIOR
# =============================================================================
stem_interior:
  description: >
    Whether the stem is hollow, solid, or intermediate. Checked by cutting
    the stem lengthwise. Diagnostic for many genera.
  canonical_values:
    hollow: "Completely empty inside"
    solid: "Firm flesh throughout, no cavity"
    stuffed: "Filled with soft pith that may become hollow with age"
  aliases:
    "fistoloso": "hollow"
    "solid to stuffed": "stuffed"
    "solid or pithy-hollow": "stuffed"
    "stuffed then hollow": "stuffed"
  similarity_matrix:
    "hollow-stuffed": 0.5
    "stuffed-solid": 0.5
    "hollow-solid": 0.0

