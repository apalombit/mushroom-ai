# Known lookalike pairs from mycological literature.
# Used to validate that the similarity engine correctly ranks these as similar.
#
# A good system should rank species_b in the top-5 results when querying species_a
# (and vice versa).
#
# danger_note explains why this confusion matters (for display + safety).

pairs:
  - species_a: "Amanita caesarea"
    species_b: "Amanita muscaria"
    danger_note: "A. caesarea is choice edible; A. muscaria is toxic. Confused when young (egg stage)."
    source: "European field guides"

  - species_a: "Amanita caesarea"
    species_b: "Amanita phalloides"
    danger_note: "A. caesarea is choice edible; A. phalloides is deadly. Young specimens can look similar."
    source: "European field guides"

  - species_a: "Agaricus campestris"
    species_b: "Agaricus xanthodermus"
    danger_note: "A. campestris is edible; A. xanthodermus causes GI distress. Very similar appearance."
    source: "European field guides"

  - species_a: "Agaricus campestris"
    species_b: "Amanita phalloides"
    danger_note: "A. campestris is edible; A. phalloides is deadly. Young A. phalloides can resemble field mushrooms."
    source: "Multiple sources"

  - species_a: "Cantharellus cibarius"
    species_b: "Omphalotus olearius"
    danger_note: "C. cibarius is choice edible; O. olearius is toxic. Similar orange color and shape."
    source: "Global field guides"

  - species_a: "Cantharellus cibarius"
    species_b: "Hygrophoropsis aurantiaca"
    danger_note: "C. cibarius is edible; H. aurantiaca is inedible/mildly toxic. Very similar appearance."
    source: "European field guides"

  - species_a: "Boletus edulis"
    species_b: "Tylopilus felleus"
    danger_note: "B. edulis is choice edible; T. felleus is extremely bitter (inedible). Similar cap and stem."
    source: "European field guides"

  - species_a: "Macrolepiota procera"
    species_b: "Chlorophyllum molybdites"
    danger_note: "M. procera is edible; C. molybdites is toxic. Nearly identical appearance."
    source: "Global field guides"

  - species_a: "Morchella esculenta"
    species_b: "Gyromitra esculenta"
    danger_note: "M. esculenta is choice edible; G. esculenta is toxic (potentially deadly). Both are spring fungi."
    source: "Global field guides"

  - species_a: "Kuehneromyces mutabilis"
    species_b: "Galerina marginata"
    danger_note: "K. mutabilis is edible; G. marginata is deadly. Grow in similar habitats on wood."
    source: "European field guides"

  - species_a: "Armillaria mellea"
    species_b: "Galerina marginata"
    danger_note: "A. mellea is conditionally edible; G. marginata is deadly. Can grow on same substrates."
    source: "European field guides"

  - species_a: "Amanita rubescens"
    species_b: "Amanita pantherina"
    danger_note: "A. rubescens is edible (cooked); A. pantherina is toxic. Similar cap with patches."
    source: "European field guides"

  - species_a: "Lactarius deliciosus"
    species_b: "Lactarius torminosus"
    danger_note: "L. deliciosus is edible; L. torminosus is toxic raw. Similar Lactarius appearance."
    source: "European field guides"

  - species_a: "Coprinus comatus"
    species_b: "Coprinopsis atramentaria"
    danger_note: "C. comatus is edible; C. atramentaria causes illness with alcohol."
    source: "European field guides"

  - species_a: "Russula virescens"
    species_b: "Amanita phalloides"
    danger_note: "R. virescens is edible; A. phalloides is deadly. Green-capped species confusion."
    source: "European field guides"

