# Seed species list for initial ingestion.
#
# Focus: species commonly found in Northern Italy / Mediterranean Europe,
# plus globally important species with known dangerous lookalike relationships.
#
# Format: scientific_name, common_name (English), edibility
# This list will be read by the ingestion pipeline to know which species to fetch.
#
# Expand this list as needed. The ingestion pipeline handles new additions incrementally.

species:
  # --- Amanita (critical: contains both choice edibles and deadly species) ---
  - scientific_name: "Amanita caesarea"
    common_name: "Caesar's mushroom"
    edibility: "edible"
  - scientific_name: "Amanita phalloides"
    common_name: "Death cap"
    edibility: "deadly"
  - scientific_name: "Amanita muscaria"
    common_name: "Fly agaric"
    edibility: "toxic"
  - scientific_name: "Amanita pantherina"
    common_name: "Panther cap"
    edibility: "toxic"
  - scientific_name: "Amanita rubescens"
    common_name: "Blusher"
    edibility: "conditionally edible"
  - scientific_name: "Amanita verna"
    common_name: "Fool's mushroom"
    edibility: "deadly"
  - scientific_name: "Amanita virosa"
    common_name: "Destroying angel"
    edibility: "deadly"

  # --- Boletus / Porcini group ---
  - scientific_name: "Boletus edulis"
    common_name: "Porcini / King bolete"
    edibility: "edible"
  - scientific_name: "Tylopilus felleus"
    common_name: "Bitter bolete"
    edibility: "inedible"
  - scientific_name: "Boletus satanas"
    common_name: "Satan's bolete"
    edibility: "toxic"

  # --- Agaricus (field mushrooms) ---
  - scientific_name: "Agaricus campestris"
    common_name: "Field mushroom"
    edibility: "edible"
  - scientific_name: "Agaricus xanthodermus"
    common_name: "Yellow-staining mushroom"
    edibility: "toxic"
  - scientific_name: "Agaricus arvensis"
    common_name: "Horse mushroom"
    edibility: "edible"

  # --- Chanterelles ---
  - scientific_name: "Cantharellus cibarius"
    common_name: "Chanterelle"
    edibility: "edible"
  - scientific_name: "Omphalotus olearius"
    common_name: "Jack-o'-lantern mushroom"
    edibility: "toxic"
  - scientific_name: "Hygrophoropsis aurantiaca"
    common_name: "False chanterelle"
    edibility: "inedible"

  # --- Macrolepiota (parasol mushrooms) ---
  - scientific_name: "Macrolepiota procera"
    common_name: "Parasol mushroom"
    edibility: "edible"
  - scientific_name: "Chlorophyllum molybdites"
    common_name: "Green-spored parasol"
    edibility: "toxic"
  - scientific_name: "Chlorophyllum rhacodes"
    common_name: "Shaggy parasol"
    edibility: "conditionally edible"

  # --- Russula ---
  - scientific_name: "Russula virescens"
    common_name: "Green-cracking russula"
    edibility: "edible"
  - scientific_name: "Russula emetica"
    common_name: "The sickener"
    edibility: "toxic"

  # --- Other important species ---
  - scientific_name: "Armillaria mellea"
    common_name: "Honey fungus"
    edibility: "conditionally edible"
  - scientific_name: "Galerina marginata"
    common_name: "Funeral bell"
    edibility: "deadly"
  - scientific_name: "Kuehneromyces mutabilis"
    common_name: "Sheathed woodtuft"
    edibility: "edible"
  - scientific_name: "Morchella esculenta"
    common_name: "Morel"
    edibility: "edible"
  - scientific_name: "Gyromitra esculenta"
    common_name: "False morel"
    edibility: "toxic"
  - scientific_name: "Coprinus comatus"
    common_name: "Shaggy ink cap"
    edibility: "edible"
  - scientific_name: "Coprinopsis atramentaria"
    common_name: "Common ink cap"
    edibility: "conditionally edible"
  - scientific_name: "Lactarius deliciosus"
    common_name: "Saffron milk cap"
    edibility: "edible"
  - scientific_name: "Lactarius torminosus"
    common_name: "Woolly milkcap"
    edibility: "toxic"
  - scientific_name: "Pleurotus ostreatus"
    common_name: "Oyster Mushroom"
    edibility: "Edible"
  - scientific_name: "Lentinula edodes"
    common_name: "Shiitake"
    edibility: "Edible"
  - scientific_name: "Agaricus bisporus"
    common_name: "Button Mushroom / Cremini / Portobello"
    edibility: "Edible"
  - scientific_name: "Flammulina velutipes"
    common_name: "Enoki / Velvet Shank"
    edibility: "Edible"
  - scientific_name: "Pleurotus eryngii"
    common_name: "King Oyster Mushroom / Royal Trumpet Mushroom"
    edibility: "Edible"
  - scientific_name: "Hericium erinaceus"
    common_name: "Lion's Mane"
    edibility: "Edible"
  - scientific_name: "Lycoperdon perlatum"
    common_name: "Common Puffball / Gem-studded Puffball"
    edibility: "Edible when young (flesh must be pure white inside)"
  - scientific_name: "Craterellus cornucopioides"
    common_name: "Horn of Plenty / Black Trumpet"
    edibility: "Edible"
  - scientific_name: "Hydnum repandum"
    common_name: "Hedgehog Mushroom / Sweet Tooth"
    edibility: "Edible"
  - scientific_name: "Russula cyanoxantha"
    common_name: "Charcoal Burner"
    edibility: "Edible"
  - scientific_name: "Cortinarius Caperatus"
    common_name: "Gypsy Mushroom / Wrinkled Cort"
    edibility: "Edible (choice; one of the few safe Cortinarius species)"
  - scientific_name: "Amanita citrina"
    common_name: "False Death Cap / Citron Amanita"
    edibility: "Inedible (unpleasant odour; not deadly but not recommended for consumption)"
  - scientific_name: "Amanita ocreata"
    common_name: "Western Destroying Angel / Spring Destroying Angel"
    edibility: "Deadly toxic (contains amatoxins)"
  - scientific_name: "Macrolepiota rhacodes"
    common_name: "Shaggy Parasol"
    edibility: "Edible with caution (can cause gastrointestinal upset in sensitive individuals; must be well cooked)"
  - scientific_name: "Lepiota"
    common_name: "Dapperling (genus)"
    edibility: "Variable — many species deadly toxic (contain amatoxins); entire genus should be avoided by non-experts"
  - scientific_name: "Morchella conica"
    common_name: "Conical Morel / Black Morel"
    edibility: "Edible (must be thoroughly cooked; toxic when raw)"
  - scientific_name: "Morchella punctipes"
    common_name: "Half-free Morel"
    edibility: "Edible (must be thoroughly cooked; toxic when raw)"
  - scientific_name: "Calvatia gigantea"
    common_name: "Giant Puffball"
    edibility: "Edible when young (flesh must be pure white and homogeneous inside)"
  - scientific_name: "Volvariella volvacea"
    common_name: "Paddy Straw Mushroom / Straw Mushroom"
    edibility: "Edible (widely cultivated in Asia; caution: volva may resemble deadly Amanita buttons)"
  - scientific_name: "Hypholoma fasciculare"
    common_name: "Sulphur Tuft"
    edibility: "Toxic (causes gastrointestinal distress; suspected neurotoxic compounds)"
  - scientific_name: "Hypholoma sublateritium"
    common_name: "Brick Cap / Brick-red Hypholoma"
    edibility: "Edible with caution (edible when thoroughly cooked; bitter raw; some mild toxicity reported)"
  - scientific_name: "Psilocybe cubensis"
    common_name: "Golden Teacher / Magic Mushroom"
    edibility: "Psychoactive (contains psilocybin and psilocin; controlled substance in most jurisdictions)"
  - scientific_name: "Clitocybe dealbata"
    common_name: "Ivory Funnel / Fool's Funnel"
    edibility: "Toxic (contains muscarine; causes muscarinic poisoning syndrome)"
  - scientific_name: "Clitocybe gibba"
    common_name: "Common Funnel / Funnel Cap"
    edibility: "Edible with caution (some mild toxicity reported; easily confused with toxic lookalikes such as Clitocybe dealbata)"
  - scientific_name: "Hypholoma capnoides"
    common_name: "Conifer Tuft / Smoky-gilled Woodlover"
    edibility: "Edible (safe when cooked; distinguished from toxic Sulphur Tuft by smoky-grey gills and lack of bitterness)"
  - scientific_name: "Laccaria amethystina"
    common_name: "Amethyst Deceiver"
    edibility: "Edible (must be thoroughly cooked; can bioaccumulate arsenic in contaminated soils)"
  - scientific_name: "Cortinarius Violaceus"
    common_name: "Violet Webcap / Violet Cort"
    edibility: "Not recommended (sometimes listed as edible but not choice; risk of confusion with toxic Cortinarius species)"
  - scientific_name: "Cortinarius Seriocybe"
    common_name: "Seriocybe Webcap (subgenus / species group)"
    edibility: "Not recommended (a subgenus grouping including species of uncertain or questionable edibility; avoid)"
  - scientific_name: "Russula Vesca"
    common_name: "Bare-toothed Russula / The Flirt"
    edibility: "Edible (mild flavour; one of the better edible Russula species)"

# Add more species as needed — the ingestion pipeline handles new additions.
