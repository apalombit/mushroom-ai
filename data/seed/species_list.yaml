# ============================================================
# Mushroom Species of Northern Italy, Alps, Austria & Slovenia
# ============================================================
# Compiled from: FungiAtlas, First-Nature, MushroomExpert,
# GBIF/iNaturalist observation data, "Pilze der Schweiz"
# (Breitenbach & Kränzlin), Italian Mycological Society (AMB),
# Checklist of Italian Fungi (Onofri 2005), Bern Convention
# ECCF species data, Monaco Nature Encyclopedia, and expert
# mycological knowledge of Alpine macrofungi.
#
# Regions covered: Trentino-Alto Adige, Veneto (Dolomites),
# Friuli-Venezia Giulia, Lombardy (Bergamo/Brescia Alps),
# Piedmont (Val d'Aosta border), Austrian Tyrol, Carinthia,
# Styria, Slovenia (Julian Alps, Karawanken).
#
# Edibility codes:
#   "Edible"               = choice/good edible
#   "Conditionally edible" = requires cooking or caution
#   "Inedible"             = no food value / unpalatable
#   "Toxic"                = causes illness
#   "Deadly toxic"         = potentially fatal
#   "Psychoactive"         = contains psilocybin/psilocin
#   "Unknown"              = insufficient data
#
# Tag: group = taxonomic family or order
# ============================================================

