# Grouping profile: default
# Each key is a DB embedding slot (embedding_<key>).
# Values are lists of dot-path feature fields to embed together.

macro_visual:
  - cap.shape
  - cap.colors
  - cap.color_faded
  - cap.color_pattern
  - cap.surface_texture
  - cap.surface_moisture
  - cap.scales_or_warts
  - cap.margin_type
  - cap.margin_lined_at_maturity
  - cap.bruising_color
  - cap.central_depression
  - hymenium.type
  - spore_print_color
  - overall_size_class
  - overall_body_form
  - growth_habit
  - edibility_status
  - known_lookalikes

structural:
  # Gills
  - gills.attachment
  - gills.spacing
  - gills.color
  - gills.color_with_age
  - gills.thickness
  - gills.texture
  - gills.edge_texture
  # Pores (non-numeric)
  - pores.color
  - pores.color_with_age
  - pores.bruising_color
  # Stem (non-numeric)
  - stem.color
  - stem.color_with_age
  - stem.surface_texture
  - stem.reticulation
  - stem.shape
  - stem.attachment_position
  - stem.consistency
  - stem.hollow_or_solid
  - stem.base_color
  - stem.basal_mycelium_color
  - stem.finger_stain_color
  - stem.bruising_color
  # Veil
  - veil.present
  - veil.type
  - veil.cortina_present
  - veil.shape
  - veil.color
  - veil.ring_position
  - veil.ring_mobility
  - veil.ring_persistence
  # Volva
  - volva.present
  - volva.type
  - volva.color

flesh_sensory:
  - flesh.color
  - flesh.bruising_color
  - flesh.latex_presence
  - flesh.latex_color
  - flesh.odor
  - flesh.taste
  - flesh.texture
  - flesh.hyphal_structure
  - flesh.cap_stem_consistency
  - flesh.quantity

