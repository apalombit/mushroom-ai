# Vision Feature Registry
#
# Derived from data/reference/morphological_vocabulary.yaml.
# Each entry defines a classification head target.
#
# Fields:
#   classes:     list of canonical values (order = label index)
#   num_classes: len(classes)
#   tier:        1 = start here, 2 = add next, 3 = advanced
#   source:      where canonical values come from in the vocabulary

# ── Tier 1: high visual signal, high impact ──────────────────────────────────

hymenium_type:
  tier: 1
  num_classes: 7
  classes:
    - gills
    - ridges
    - pores
    - teeth
    - smooth
    - gleba
    - alveolate
  source: "morphological_vocabulary.yaml → hymenium_type"

